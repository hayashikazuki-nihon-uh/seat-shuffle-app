<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>席替えアプリ</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="席替え" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.json" />
  <script>
    // ホーム画面アプリとして起動しているかを、iOSで確実に判定できる方法で調べておく
    if (window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)) {
      document.documentElement.classList.add('standalone');
    }
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="mode-admin">
  <div id="admin-view" class="view">
    <div class="admin-header-sticky">
      <header class="admin-header">
        <h1>席替えアプリ</h1>
        <nav class="tabs">
          <button class="tab-btn active" data-tab="roster">名簿</button>
          <button class="tab-btn" data-tab="layout">レイアウト</button>
          <button class="tab-btn" data-tab="conditions">条件設定</button>
          <button class="tab-btn" data-tab="history">履歴</button>
        </nav>
        <button id="go-projection-btn" class="primary-btn go-projection-btn">投影モードへ切替 ▶</button>
      </header>
      <p id="mismatch-banner" class="mismatch-banner hidden"></p>
    </div>
    <main>
      <section id="tab-roster" class="tab-panel active"></section>
      <section id="tab-layout" class="tab-panel"></section>
      <section id="tab-conditions" class="tab-panel"></section>
      <section id="tab-history" class="tab-panel"></section>
    </main>
  </div>

  <div id="projection-view" class="view">
    <div id="projection-stage" class="projection-stage"></div>
    <p id="projection-error" class="projection-error hidden"></p>
    <div id="projection-controls" class="projection-controls">
      <button id="shuffle-btn" class="shuffle-btn">🎲 抽選開始</button>
      <button id="flip-btn" class="flip-btn" title="生徒側/教卓側の表示切り替え">🔄 教卓側</button>
      <button id="save-image-btn" class="save-image-btn">画像として保存</button>
      <button id="exit-projection-btn" class="exit-btn" title="管理モードに戻る">⚙</button>
    </div>
  </div>

  <div id="modal-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
